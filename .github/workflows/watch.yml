name: watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: restore last reading
        uses: actions/cache/restore@v4
        with:
          path: ~/.campus/state.json
          key: campus-state-${{ github.run_id }}
          restore-keys: campus-state-
      - name: check UMS
        env:
          CAMPUS_USER: ${{ secrets.UMS_USER }}
          CAMPUS_PASSWORD: ${{ secrets.UMS_PASSWORD }}
          CAMPUS_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CAMPUS_TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          CAMPUS_QUIET: "1"
        run: xvfb-run -a python campus.py once
      - name: save this reading
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.campus/state.json
          key: campus-state-${{ github.run_id }}
